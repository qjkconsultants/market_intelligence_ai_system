services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./services/api
    container_name: doc-ingestion-api
    ports:
      - "8080:8080"
    environment:
      # ---- App identity ----
      APP_ENV: local
      SERVICE_NAME: doc-ingestion-api
      LOG_LEVEL: INFO

      # ---- S3 / MinIO ----
      S3_ENDPOINT_URL: http://minio:9000          # internal (Docker)
      S3_PUBLIC_ENDPOINT: http://localhost:9000   # external (curl/browser)
      S3_BUCKET_NAME: docs
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: ap-southeast-2
      S3_USE_SSL: "false"

      # ---- DynamoDB ----
      DDB_TABLE_NAME: DocumentIngestion
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DDB_ENDPOINT_URL: http://dynamodb-local:8000

      # ---- Auth / RBAC (disabled locally) ----
      AUTH_ENABLED: "false"
      TENANT_CLAIM: "tenant_id"
      GROUPS_CLAIM: "cognito:groups"
      ROLES_CLAIM: "roles"
      RBAC_POLICY_JSON: '{"FINANCE":["finance"],"OPS":["ops"],"TRADER":["trading"],"ADMIN":["*"]}'

      # ---- Step Functions (disabled locally) ----
      ENABLE_STEP_FUNCTIONS: "false"
      STEP_FUNCTION_ARN: ""

      # ---- Observability (DISABLED) ----
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none

      # ---- Limits ----
      PRESIGN_EXPIRES_SECONDS: "900"
      MAX_UPLOAD_SIZE_BYTES: "52428800"

    depends_on:
      dynamodb-local:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  minio_data:
